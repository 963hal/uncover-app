<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const APP_VERSION='P4.3';
const hud=$('hud'), logEl=$('log'), flash=$('flash');
function log(m){ const t=new Date().toLocaleTimeString(); logEl.innerHTML+=`<br>[${t}] ${m}`; logEl.scrollTop=1e6; }

// 音と振動（発見通知・素人にも分かる合図）
let actx=null;
function ensureAudio(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch{} }
addEventListener('pointerdown',ensureAudio,{once:false});
function beep(){ try{ if(!actx) return; const o=actx.createOscillator(),g=actx.createGain();
  o.type='sine'; o.frequency.value=880; g.gain.value=.18; o.connect(g); g.connect(actx.destination);
  o.start(); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6); o.stop(actx.currentTime+.65);
  setTimeout(()=>{ try{ const o2=actx.createOscillator(),g2=actx.createGain(); o2.type='sine'; o2.frequency.value=1320;
  g2.gain.value=.14; o2.connect(g2); g2.connect(actx.destination); o2.start();
  g2.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.5); o2.stop(actx.currentTime+.55);}catch{} },140);
}catch{} }
function buzz(){ try{ navigator.vibrate && navigator.vibrate([90,50,140]); }catch{} }
function celebrate(name){ flash.style.opacity=1; setTimeout(()=>flash.style.opacity=0,450); beep(); buzz(); }

// --- シーン（1unit=1m、400m四方） ---
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1020);
scene.fog=new THREE.Fog(0x0b1020,40,180);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,600);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
const hemi=new THREE.HemisphereLight(0x8aa0ff,0x0a0f1e,.95); scene.add(hemi);
const moon=new THREE.DirectionalLight(0xbfd0ff,.85); moon.position.set(30,50,20); scene.add(moon);

const WORLD=400, CELL=10, AUTO_R=20, TAP_R=30;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(WORLD,WORLD),
  new THREE.MeshStandardMaterial({color:0x182238,roughness:1}));
ground.rotation.x=-Math.PI/2; scene.add(ground);

// ダミー格子（OSM成功で自動OFF・ボタンで戻せる）
const roadGroup=new THREE.Group(); scene.add(roadGroup);
{
  const m=new THREE.MeshStandardMaterial({color:0x2c3a5c,roughness:.9});
  for(let i=-WORLD/2;i<=WORLD/2;i+=40){
    const a=new THREE.Mesh(new THREE.PlaneGeometry(WORLD,3),m);
    a.rotation.x=-Math.PI/2; a.position.set(0,.02,i); roadGroup.add(a);
    const b=new THREE.Mesh(new THREE.PlaneGeometry(3,WORLD),m);
    b.rotation.x=-Math.PI/2; b.position.set(i,.02,0); roadGroup.add(b);
  }
}
const gridBtn=$('gridBtn');
function setGrid(on){ roadGroup.visible=on; gridBtn.textContent='仮の道路: '+(on?'ON':'OFF'); gridBtn.classList.toggle('on',on); }
gridBtn.onclick=()=>setGrid(!roadGroup.visible);

const osmGroup=new THREE.Group(); scene.add(osmGroup);
const osmRoadMat=new THREE.MeshStandardMaterial({color:0x3a4a6e,roughness:.85});
function ribbonMesh(pts,width,y){
  const pos=[],idx=[];
  for(let i=0;i<pts.length;i++){
    const p=pts[i], q=pts[Math.min(i+1,pts.length-1)], o=pts[Math.max(i-1,0)];
    let dx=q.x-o.x, dz=q.z-o.z; const l=Math.hypot(dx,dz)||1; dx/=l; dz/=l;
    const nx=-dz*width/2, nz=dx*width/2;
    pos.push(p.x+nx,y,p.z+nz, p.x-nx,y,p.z-nz);
    if(i>0){ const a=(i-1)*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g,osmRoadMat);
}
function drawOSMWays(elements, origin){
  while(osmGroup.children.length) osmGroup.remove(osmGroup.children[0]);
  const mat=new THREE.LineBasicMaterial({color:0x9fd6ff});
  let n=0;
  for(const el of elements){
    if(el.type!=='way'||!el.geometry) continue;
    const pts=[];
    for(const p of el.geometry){
      const dx=(p.lon-origin.lon)*Math.cos(origin.lat*Math.PI/180)*111320;
      const dz=-((p.lat-origin.lat)*110540);
      if(Math.abs(dx)>WORLD/2||Math.abs(dz)>WORLD/2) continue;
      pts.push(new THREE.Vector3(dx,.15,dz));
    }
    if(pts.length<2) continue;
    if(n<250) osmGroup.add(ribbonMesh(pts,5,.08));
    osmGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat));
    n++;
  }
  log(`${n}本の道路を表示（青線・多少のずれはGPS誤差とデータ差）`);
  if(n>0 && roadGroup.visible){ setGrid(false); log('仮の道路を自動OFF（実道路優先）。戻す時はボタンでON。'); }
}

// 北の目印（赤い柱=北・方角の基準）
const northPole=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,60,10),
  new THREE.MeshStandardMaterial({color:0xff5566,emissive:0x661111}));
northPole.position.set(0,30,-190); scene.add(northPole);

// ランドマーク
const tower=new THREE.Mesh(new THREE.CylinderGeometry(2,3,44,8),
  new THREE.MeshStandardMaterial({color:0x6f7fd6,emissive:0x2a3570,emissiveIntensity:1}));
tower.position.set(60,22,-90); scene.add(tower);
const gate=new THREE.Mesh(new THREE.TorusGeometry(7,1.1,10,28),
  new THREE.MeshStandardMaterial({color:0x88d6a0,emissive:0x1d4a2e,emissiveIntensity:1}));
gate.position.set(-60,7,-60); scene.add(gate);

// 夜森の環境（星・地面の濃淡・木・岩・固定シードで毎回同じ森）
function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const RND=rng32(20260911);
// 丸い光粒テクスチャ（点描画の四角対策）
function dotTexture(){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(.4,'rgba(255,255,255,.8)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
const DOT=dotTexture();
{
  const N=350, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){ const a=RND()*Math.PI*2, e=RND()*Math.PI*.45+.08, r=450;
    pos[i*3]=Math.cos(a)*Math.cos(e)*r; pos[i*3+1]=Math.sin(e)*r; pos[i*3+2]=Math.sin(a)*Math.cos(e)*r; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xcfe0ff,size:1.6,sizeAttenuation:false,fog:false,map:DOT,transparent:true,depthWrite:false})));
}
{
  const m1=new THREE.MeshBasicMaterial({color:0x101a30,transparent:true,opacity:.5});
  const m2=new THREE.MeshBasicMaterial({color:0x1e2c4a,transparent:true,opacity:.5});
  for(let i=0;i<36;i++){ const r=8+RND()*22;
    const m=new THREE.Mesh(new THREE.CircleGeometry(r,20),RND()<.5?m1:m2);
    m.rotation.x=-Math.PI/2; m.position.set((RND()-.5)*(WORLD-40),.012,(RND()-.5)*(WORLD-40)); scene.add(m); }
}
function nearGrid(x,z){ const gx=((x%40)+40)%40, gz=((z%40)+40)%40;
  return Math.min(gx,40-gx)<4.5||Math.min(gz,40-gz)<4.5; }
{
  const NT=260, dummy=new THREE.Object3D();
  const trunks=new THREE.InstancedMesh(new THREE.CylinderGeometry(.25,.35,2.2,7),
    new THREE.MeshStandardMaterial({color:0x5a4030,roughness:1}),NT);
  const leaves=new THREE.InstancedMesh(new THREE.ConeGeometry(1.8,4.2,8),
    new THREE.MeshStandardMaterial({color:0x1f5a3a,roughness:.9,emissive:0x0a2415,emissiveIntensity:.6}),NT);
  let ti=0, guard=0;
  while(ti<NT&&guard++<6000){
    const x=(RND()-.5)*(WORLD-20), z=(RND()-.5)*(WORLD-20);
    if(Math.hypot(x,z)<8||nearGrid(x,z)) continue;
    const s=.7+RND()*.9;
    dummy.rotation.set(0,RND()*6.28,0);
    dummy.position.set(x,1.1*s,z); dummy.scale.setScalar(s); dummy.updateMatrix();
    trunks.setMatrixAt(ti,dummy.matrix);
    dummy.position.set(x,3.6*s,z); dummy.updateMatrix();
    leaves.setMatrixAt(ti,dummy.matrix);
    ti++;
  }
  trunks.instanceMatrix.needsUpdate=true; leaves.instanceMatrix.needsUpdate=true;
  scene.add(trunks); scene.add(leaves);
  const NR=110;
  const rocks=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(.7),
    new THREE.MeshStandardMaterial({color:0x55607a,roughness:1}),NR);
  let ri=0; guard=0;
  while(ri<NR&&guard++<4000){
    const x=(RND()-.5)*(WORLD-20), z=(RND()-.5)*(WORLD-20);
    if(Math.hypot(x,z)<6||nearGrid(x,z)) continue;
    dummy.rotation.set(RND()*3,RND()*3,RND()*3);
    dummy.position.set(x,.3,z); dummy.scale.setScalar(.5+RND()); dummy.updateMatrix();
    rocks.setMatrixAt(ri,dummy.matrix); ri++;
  }
  rocks.instanceMatrix.needsUpdate=true; scene.add(rocks);
  // 遺跡柱（道沿いにぽつぽつ・高さ不揃い）
  const NP=60;
  const pillars=new THREE.InstancedMesh(new THREE.BoxGeometry(1.4,1,1.4),
    new THREE.MeshStandardMaterial({color:0x4a5a7e,roughness:.9,emissive:0x111a30,emissiveIntensity:.5}),NP);
  let pi=0; guard=0;
  while(pi<NP&&guard++<4000){
    const alongRoad=RND()<.7;
    let x,z;
    if(alongRoad){ const gx=Math.round((RND()-.5)*9)*40+(RND()<.5?-7:7); x=gx+(RND()-.5)*3; z=(RND()-.5)*(WORLD-20); }
    else { x=(RND()-.5)*(WORLD-20); z=(RND()-.5)*(WORLD-20); }
    if(Math.abs(x)>WORLD/2-4||Math.abs(z)>WORLD/2-4||Math.hypot(x,z)<10) continue;
    const h=2+RND()*5;
    dummy.rotation.set(0,RND()*.6,0);
    dummy.position.set(x,h/2,z); dummy.scale.set(1,h,1); dummy.updateMatrix();
    pillars.setMatrixAt(pi,dummy.matrix); pi++;
  }
  pillars.instanceMatrix.needsUpdate=true; scene.add(pillars);
}
// ホタル（2層でゆっくり回転・夜森の奥行き）
const fireflyA=new THREE.Group(), fireflyB=new THREE.Group();
{
  const mk=(n,col,size)=>{
    const pos=new Float32Array(n*3);
    for(let i=0;i<n;i++){ const a=RND()*Math.PI*2, r=15+RND()*110;
      pos[i*3]=Math.cos(a)*r; pos[i*3+1]=.5+RND()*6; pos[i*3+2]=Math.sin(a)*r; }
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    return new THREE.Points(g,new THREE.PointsMaterial({color:col,size,transparent:true,opacity:.8,map:DOT,depthWrite:false}));
  };
  fireflyA.add(mk(70,0xaaffcc,2.4)); fireflyB.add(mk(50,0xffe27a,2.0));
  scene.add(fireflyA); scene.add(fireflyB);
}

// 仮主人公（たんけんぼうし・顔が進行方向）
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.7,1.1,6,14),
  new THREE.MeshStandardMaterial({color:0xffc46b,roughness:.6}));
body.position.y=1.2; player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.48,18,14),
  new THREE.MeshStandardMaterial({color:0xffe0b8,roughness:.7}));
head.position.y=2.25; player.add(head);
const hat=new THREE.Mesh(new THREE.ConeGeometry(.62,.75,14),
  new THREE.MeshStandardMaterial({color:0x3f7a4e,roughness:.8}));
hat.position.y=2.8; player.add(hat);
{
  const wM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.4});
  const bM=new THREE.MeshStandardMaterial({color:0x14141c,roughness:.4});
  [-.18,.18].forEach(x=>{
    const w=new THREE.Mesh(new THREE.SphereGeometry(.11,10,8),wM);
    w.position.set(x,2.3,.4); player.add(w);
    const b=new THREE.Mesh(new THREE.SphereGeometry(.05,8,6),bM);
    b.position.set(x,2.3,.5); player.add(b);
  });
}
scene.add(player);
const autoRing=new THREE.Mesh(new THREE.RingGeometry(AUTO_R-.4,AUTO_R,48),
  new THREE.MeshBasicMaterial({color:0xffd77a,transparent:true,opacity:.35,side:THREE.DoubleSide}));
autoRing.rotation.x=-Math.PI/2; autoRing.position.y=.06; scene.add(autoRing);
const accCircle=new THREE.Mesh(new THREE.RingGeometry(1,1.3,40),
  new THREE.MeshBasicMaterial({color:0x88aaff,transparent:true,opacity:.5,side:THREE.DoubleSide}));
accCircle.rotation.x=-Math.PI/2; accCircle.position.y=.07; accCircle.visible=false; scene.add(accCircle);
let px=0,pz=0,heading=0;

// モンスター（浮く体＋顔・こっちを見てぷかぷかする）
const secrets=[];
function addSecret(x,z,color,homeOnly=false,name='モンスター',id=null){
  const g=new THREE.Group();
  const R=homeOnly?1.1:.8;
  const m=new THREE.Mesh(new THREE.SphereGeometry(R,20,16),
    new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.45,roughness:.6,transparent:true,opacity:0}));
  m.position.y=1.1; g.add(m);
  const wm=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0,roughness:.4});
  const bm=new THREE.MeshStandardMaterial({color:0x14141c,transparent:true,opacity:0,roughness:.4});
  const ex=R*.34, ey=1.25, ez=R*.76;
  [-ex,ex].forEach(x=>{
    const w=new THREE.Mesh(new THREE.SphereGeometry(R*.22,10,8),wm);
    w.position.set(x,ey,ez); g.add(w);
    const b=new THREE.Mesh(new THREE.SphereGeometry(R*.1,8,6),bm);
    b.position.set(x,ey,ez+R*.15); g.add(b);
  });
  const ring=new THREE.Mesh(new THREE.RingGeometry(1.2,1.6,28),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:0,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2; ring.position.y=.08; g.add(ring);
  g.position.set(x,0,z); g.userData={homeOnly,name,found:false,core:m,halo:ring,mats:[m.material,wm,bm],ph:RND()*6.28,
    id:id||('c'+Math.random().toString(36).slice(2,9)),wx:0,wz:0,wt:Math.random()*3};
  scene.add(g); secrets.push(g);
}
addSecret(12,4,0x7affd4,false,'チビドラゴン','m1');
addSecret(-10,-12,0x7affd4,false,'かげイタチ','m2');
addSecret(22,-20,0xc49bff,false,'ヒカリクラゲ','m3');
addSecret(-26,10,0xffe27a,false,'すなねこ','m4');
addSecret(36,18,0x7affd4,false,'きのこ兵','m5');
addSecret(0,-34,0xff8ab0,true,'家守りゴーレム（家限定）','m6');

// 保存（uncover-app-v1・旧P1/P0から引継ぎ・追加出現も保存）

function todayKey(d=new Date()){ return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }

// 移動スティック（丸型アナログ・斜め可・倒し具合で速度変化）
const joy={x:0,y:0};
{
  const base=$('joy'), knob=$('knob');
  const R=44; let tid=null;
  const setKnob=(dx,dy)=>{ knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`; };
  const move=e=>{
    const t=[...e.touches].find(t=>t.identifier===tid) || e.touches[0];
    const r=base.getBoundingClientRect();
    let dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2);
    const l=Math.hypot(dx,dy);
    if(l>R){ dx=dx/l*R; dy=dy/l*R; }
    setKnob(dx,dy); joy.x=dx/R; joy.y=dy/R;
  };
  const end=e=>{
    if(tid!==null && [...e.changedTouches].some(t=>t.identifier===tid)){
      tid=null; joy.x=0; joy.y=0; setKnob(0,0);
    }
  };
  base.addEventListener('touchstart',e=>{ e.preventDefault(); ensureAudio();
    tid=e.changedTouches[0].identifier; move(e); },{passive:false});
  base.addEventListener('touchmove',e=>{ e.preventDefault(); if(tid!==null) move(e); },{passive:false});
  base.addEventListener('touchend',end); base.addEventListener('touchcancel',end);
  base.addEventListener('contextmenu',e=>e.preventDefault());
  // PC確認用（マウス）
  let mdown=false;
  base.addEventListener('mousedown',e=>{ mdown=true; ensureAudio();
    const r=base.getBoundingClientRect();
    const mv=ev=>{ let dx=ev.clientX-(r.left+r.width/2), dy=ev.clientY-(r.top+r.height/2);
      const l=Math.hypot(dx,dy); if(l>R){dx=dx/l*R;dy=dy/l*R;} setKnob(dx,dy); joy.x=dx/R; joy.y=dy/R; };
    const up=()=>{ mdown=false; joy.x=0; joy.y=0; setKnob(0,0);
      removeEventListener('mousemove',mv); removeEventListener('mouseup',up); };
    addEventListener('mousemove',mv); addEventListener('mouseup',up); mv(e); });
}

function onFix(p){
  const{latitude:lat,longitude:lon,accuracy,speed}=p.coords;
  gpsAcc=accuracy; lastLatLon={lat,lon};
  if(accuracy&&accuracy>50){log(`精度が低いため棄却 ±${Math.round(accuracy)}m（建物影・屋内でありがち）`);return;}
  if(!origin){origin={lat,lon};$('lat').value=lat.toFixed(5);$('lon').value=lon.toFixed(5);save();log(`原点確定 lat=${lat.toFixed(5)} lon=${lon.toFixed(5)}。ここが世界の中心。`);}
  const dx=(lon-origin.lon)*Math.cos(origin.lat*Math.PI/180)*111320;
  const dz=-((lat-origin.lat)*110540);
  if(Math.abs(dx)>WORLD/2||Math.abs(dz)>WORLD/2){log('エリア外（400m超）。中心リセットか原点付近に戻る。');return;}
  const now=performance.now();
  if(lastFix){const dt=(now-lastFix.t)/1000;const d=Math.hypot(dx-lastFix.x,dz-lastFix.z);
    if(d>60&&dt<5){log(`大きな飛びを抑制 d=${d.toFixed(0)}m`);return;}
    const inst=dt>0?d/dt:0;const gpsV=(speed!=null&&speed>=0)?speed:inst;
    smoothSpeed=smoothSpeed*.6+gpsV*.4;
    if(d>1.5){heading=Math.atan2(dx-px,dz-pz);lastMove=now;} // 停止中の向きブレ防止
  }
  lastFix={x:dx,z:dz,t:now};
  px+=(dx-px)*.35; pz+=(dz-pz)*.35;
  accCircle.visible=true; accCircle.position.set(px,.07,pz);
  const r=Math.max(2,gpsAcc||5); accCircle.scale.set(r,r,1);
}

// 近いのを捕まえるボタン（精密タップ不要・太い指でもOK）
function nearestSecret(){
  let best=null,bd=1e9;
  for(const s of secrets){ const d=Math.hypot(s.position.x-px,s.position.z-pz);
    if(d<bd){bd=d;best=s;} }
  return {s:best,d:bd};
}

  const {s,d}=nearestSecret();
  if(!s){ log('対象が無い。'); return; }
  if(s.userData.homeOnly&&mode!=='home'){log(`一番近いのは「${s.userData.name}」だが家モード専用。モード:家に切替。`);return;}
  if(d>TAP_R){log(`一番近いのまで${d.toFixed(0)}m。${TAP_R}m以内でゲットできる（モンスター出現ボタン可）。`);return;}
  if(s.userData.found){ log(`また会えた: ${s.userData.name}（捕まえ済み・${d.toFixed(0)}m）`); beep(); return; }
  discover(s,`ボタン（${d.toFixed(0)}m）`);
};
// バイブ試験（端末対応の切り分け）
function vibSupported(){ try{ return ('vibrate' in navigator); }catch{ return false; } }
$('vibBtn').onclick=()=>{
  if(!vibSupported()){ log('この端末/ブラウザは振動APIなし（iPhone・PCは鳴らないのが正常）。音＋光で代用。'); beep(); return; }
  log('バイブ試験：ブルッとすればOK。無ければ下のスマホ設定を確認。');
  buzz();
};
// タップはドラッグと区別（指を滑らせた時は発火しない）
let downPos=null;
addEventListener('pointerdown',e=>{ downPos={x:e.clientX,y:e.clientY}; });
addEventListener('pointerup',e=>{
  if(!downPos) return;
  const moved=Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y); downPos=null;
  if(moved>12) return; // カメラ回転のつもり
  if(e.target!==renderer.domElement) return; // ボタン押しは除外
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const targets=[];
  secrets.forEach(s=>{ targets.push(s.userData.core); targets.push(s.userData.halo); });
  const hits=ray.intersectObjects(targets.filter(c=>c.material.opacity>.25));
  if(!hits.length){ return; }
  const hit=hits[0].object;
  const s=secrets.find(g=>g.userData.core===hit||g.userData.halo===hit);
  const d=Math.hypot(s.position.x-px,s.position.z-pz);
  if(s.userData.homeOnly&&mode!=='home'){log(`「${s.userData.name}」は家モード専用。`);return;}
  if(d>TAP_R){log('遠すぎる。もう少し近づくと自動でゲット（20m）。');return;}
  if(s.userData.found){ log(`また会えた: ${s.userData.name}（捕まえ済み）`); beep(); return; }
  discover(s,'タップ');
});

// メインループ
const clock=new THREE.Clock(), camT=new THREE.Vector3(), camFocus=new THREE.Vector3(0,0,0);
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05), now=performance.now();
  if(!gpsOn||mode==='home'){
    // 画面基準の入力（右+・下+）→カメラ基準の世界移動に変換
    let ix=0,iz=0;
    if(keys['w']||keys['arrowup'])iz-=1; if(keys['s']||keys['arrowdown'])iz+=1;
    if(keys['a']||keys['arrowleft'])ix-=1; if(keys['d']||keys['arrowright'])ix+=1;
    ix+=joy.x; iz+=joy.y; // スティックは斜め・アナログ量をそのまま加算
    if(autoWalk&&!ix&&!iz){ iz=-1; } // 地図見ながら画面上へ前進
    const fx=Math.sin(camAng), fz=Math.cos(camAng); // 画面上方向
    const rx=-Math.cos(camAng), rz=Math.sin(camAng); // 画面右方向
    let vx=rx*ix-fx*iz, vz=rz*ix-fz*iz;
    if(vx||vz){const l=Math.hypot(vx,vz);const cl=Math.min(l,1);vx/=l;vz/=l;const sp=4*cl;
      px=Math.max(-WORLD/2+5,Math.min(WORLD/2-5,px+vx*sp*dt));
      pz=Math.max(-WORLD/2+5,Math.min(WORLD/2-5,pz+vz*sp*dt));
      heading=Math.atan2(vx,vz);lastMove=now;smoothSpeed=smoothSpeed*.8+sp*.2;}
    else smoothSpeed*=.88;
  } else smoothSpeed*=.97;
  const stopped=(now-lastMove)>2000;
  const v=Math.max(0,smoothSpeed);
  const vstate=v>4?'高速移動中（景観のみ）':stopped?'停止（細部くっきり）':v>.5?'歩行中':'減速中';
  player.position.set(px,0,pz); player.rotation.y=heading;
  autoRing.position.set(px,.06,pz);
  body.position.y=1.2+((!stopped)?Math.sin(now/130)*.07:Math.sin(now/650)*.035);
  markCell();

  const fogFar=v>4?260:stopped?120:180;
  scene.fog.far+=(fogFar-scene.fog.far)*Math.min(1,dt*2);
  tower.material.emissiveIntensity=v>4?2.2:1;
  fireflyA.rotation.y+=dt*.02; fireflyB.rotation.y-=dt*.015;

  secrets.forEach(s=>{
    // 徘徊（未ゲットはゆっくり歩き回る・追いかける楽しみ用・安全調整は後回し）
    if(!s.userData.found){
      const u=s.userData; u.wt-=dt;
      if(u.wt<=0){ const a=Math.random()*Math.PI*2, sp=.4+Math.random()*.7;
        u.wx=Math.sin(a)*sp; u.wz=Math.cos(a)*sp; u.wt=2+Math.random()*3; }
      let nx=s.position.x+u.wx*dt, nz=s.position.z+u.wz*dt;
      if(nx<-WORLD/2+5||nx>WORLD/2-5){ u.wx*=-1; nx=s.position.x+u.wx*dt; }
      if(nz<-WORLD/2+5||nz>WORLD/2-5){ u.wz*=-1; nz=s.position.z+u.wz*dt; }
      s.position.x=nx; s.position.z=nz;
    }
    const d=Math.hypot(s.position.x-px,s.position.z-pz);
    const ok=!s.userData.homeOnly||mode==='home';
    const halo=s.userData.halo, mats=s.userData.mats;
    let t=0;
    if(ok&&d<32){ t=v>4?0:(stopped?.95:.4); if(s.userData.found)t=.95; }
    const k=Math.min(1,dt*4);
    for(const mt of mats) mt.opacity+=(t-mt.opacity)*k;
    halo.material.opacity+=(((ok&&d<32&&!s.userData.found)?.5:0)-halo.material.opacity)*k;
    s.userData.ph+=dt*(stopped?2.4:1.1); // ぷかぷか
    s.position.y=Math.sin(s.userData.ph)*.22;
    if(d<60&&d>.5) s.lookAt(px,s.position.y+1.1,pz); // こっちを見る
    // 自動ゲット：20mに入ったら停止・タップ不要
    if(ok&&!s.userData.found&&d<AUTO_R&&v<=4) discover(s,`接近ゲット（${d.toFixed(0)}m）`);
  });

  // カメラ：三人称＋指オフセット（外・家共通で指操作が効く）
  // 向きが急変しても体をすり抜けないよう角度を回り込みで追従
  const wantA=heading+camYaw;
  let da=wantA-camAng;
  while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2;
  camAng+=da*Math.min(1,dt*4);
  // カメラ：注視点をなめらかに追い、軌道上で直接配置（すり抜け・ズームなし）
  camFocus.lerp(player.position,Math.min(1,dt*10));
  camT.set(camFocus.x-Math.sin(camAng)*camDist,camH,camFocus.z-Math.cos(camAng)*camDist);
  camera.position.copy(camT);camera.lookAt(camFocus.x,1.6,camFocus.z);
  const dirTxt = compassDeg!=null?` コンパス${Math.round(compassDeg)}°`:'';
  const dr=dayRec();
  hud.textContent=`UNCOVER [${mode==='outside'?'外':'家'}|${gpsOn?'GPS':'模擬'}] ${vstate} ~${v.toFixed(1)}m/s${dirTxt}\n今日:${dr.caught}/${GOAL_CAUGHT}匹 ${dr.cells}/${GOAL_CELLS}マス｜累計${found.size}匹\n■床=開拓済み ◇=モンスター（近づくと自動ゲット） ${APP_VERSION}`;
  renderer.render(scene,camera);
}
tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
// 追加出現の復元＋ずかん初期化（アプリ起動時）
(store.customs||[]).forEach(c=>{ try{ addSecret(c.x,c.z,c.color,c.homeOnly,c.name,c.id); }catch{} });
secrets.forEach(s=>{ if(isFound(s)) s.userData.found=true; });
refreshZukan(); ensureWild(); refreshZukan();
try{ if(!localStorage.getItem('uncover-help-seen')) $('help').style.display='block'; }catch{ $('help').style.display='block'; }
log(`UNCOVER起動 ${APP_VERSION}。青線=現実の道路。歩くと野生モンスターが現れる。モンスターずかんで収集。更新は「更新確認」ボタン。`);
log('振動API: '+('vibrate' in navigator?'あり（バイブ試験で確認）':'なし（この端末は音＋光のみ・正常）。PC・iPhoneはなしが正常。'));
</script>
</body>
